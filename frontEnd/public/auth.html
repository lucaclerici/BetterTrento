<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterTrento - Accesso</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="no-scroll">
    <header>
        <nav>
            <div class="logo">
                <img src="..\image\stemma_trentino.jpg" class="logo-img">
                <span><a href="index.html">BetterTrento</a></span>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Eventi</a></li>
                <li><a href="#">Segnalazioni</a></li>
            </ul>
        </nav>
    </header>
    <div class="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Accedi a BetterTrento</h2>
            
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Accedi</button>
                <div class="separator">oppure</div>
                <button type="button" class="google-btn">Accedi con Google</button>
            </form>

            <form id="register-form" style="display: none;">
                <input type="text" placeholder="Nome" required>
                <input type="text" placeholder="Cognome" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="text" placeholder="Indirizzo (Via/Piazza)" required>
                <input type="text" placeholder="Città" required>
                <input type="text" placeholder="CAP" pattern="[0-9]{5}" title="inserisci 5 numeri" required>
                <input type="text" placeholder="Provincia" maxlenght="2" required>
                <input type="text" placeholder="Nazione" required>
                <button type="submit">Registrati</button>
            </form>

            <p class="toggle-text">
                Non hai un account? <a href="#" id="show-register">Registrati qui</a>
            </p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authTitle = document.getElementById('auth-title');
        const showRegister = document.getElementById('show-register');

        showRegister.addEventListener('click', (e) => {
            e.preventDefault();
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                authTitle.innerText = 'Accedi a BetterTrento';
                showRegister.innerText = 'Registrati qui';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                authTitle.innerText = 'Crea il tuo profilo';
                showRegister.innerText = 'Accedi qui';
            }
        });

        // Da aggiungere nel tag <script> di auth.html
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (data.success) {
                alert("Accesso eseguito! Token: " + data.token);
                window.location.href = "/"; // Torna alla home dopo il login
            } else {
                alert("Errore durante l'accesso");
            }
        });
    </script>
</body>
</html>
